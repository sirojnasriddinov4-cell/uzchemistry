services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uzchem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: uzchemistry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzchem -d uzchemistry"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://uzchem:${POSTGRES_PASSWORD:-devpass}@db:5432/uzchemistry
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate -w @uzchemistry/api && npm run start -w @uzchemistry/api"

volumes:
  pgdata:
